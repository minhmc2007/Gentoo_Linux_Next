name: Build Gentoo Linux Next
on:
  workflow_dispatch:
    inputs:
      create_release:
        type: boolean
        description: 'Upload to Releases?'
        default: false

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      options: --privileged

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        echo "http://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
        apk update
        # Added 'xorriso' to replace mount command
        apk add --no-cache bash wget curl squashfs-tools xorriso grub grub-efi mtools dosfstools dracut kmod jq sed

    - name: Prepare Workspace
      run: |
        mkdir -p iso_build/boot/grub
        mkdir -p iso_build/LiveOS

    # --- PART 1: EXTRACT BASE FROM ISO (NO MOUNTING) ---
    - name: Download & Extract Base System
      run: |
        echo "Downloading Gentoo Minimal ISO..."
        # 2026-01-14 Snapshot
        wget -q --show-progress -O minimal.iso "https://distfiles.gentoo.org/releases/amd64/autobuilds/20260114T140056Z/install-amd64-minimal-20260114T140056Z.iso"
        
        mkdir -p mnt_iso
        
        echo "Extracting ISO contents (using xorriso)..."
        # Extract ISO without requiring root/loop devices
        xorriso -osirrox on -indev minimal.iso -extract / mnt_iso
        
        echo "Locating Kernel..."
        # Kernel is usually named 'gentoo' or 'vmlinuz'
        KERNEL_PATH=$(find mnt_iso -name "gentoo" -o -name "vmlinuz" | head -n 1)
        
        if [ -z "$KERNEL_PATH" ]; then
           echo "CRITICAL ERROR: Could not find kernel in extracted ISO!"
           find mnt_iso
           exit 1
        fi
        
        echo "Found Kernel at: $KERNEL_PATH"
        cp "$KERNEL_PATH" iso_build/boot/kernel
        
        echo "Extracting Root Filesystem..."
        # Gentoo Minimal ISO stores rootfs in 'image.squashfs'
        SQUASH_PATH=$(find mnt_iso -name "image.squashfs" | head -n 1)
        
        if [ -z "$SQUASH_PATH" ]; then
           echo "CRITICAL ERROR: image.squashfs not found!"
           exit 1
        fi
        
        # Unpack the rootfs
        unsquashfs -d squashfs-root "$SQUASH_PATH"
        
        # Cleanup
        rm -rf mnt_iso minimal.iso

    # --- PART 2: CUSTOMIZE ---
    - name: Customize System
      run: |
        # 1. Apply Overlay (Your custom files)
        if [ -d "overlay" ]; then
          echo "Applying 'overlay/'..."
          cp -ruv overlay/* squashfs-root/
        fi
        
        # 2. Branding
        if [ -f squashfs-root/etc/os-release ]; then
           sed -i 's/^NAME=.*/NAME="Gentoo Linux Next"/' squashfs-root/etc/os-release
           sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="Gentoo Linux Next"/' squashfs-root/etc/os-release
        fi
        echo "Gentoo Linux Next" > squashfs-root/etc/issue
        
        # 3. Unlock Root (Empty Password)
        sed -i 's/^root:[^:]*:/root::/' squashfs-root/etc/shadow

    # --- PART 3: INITRAMFS ---
    - name: Regenerate Initramfs
      id: initramfs
      run: |
        # Detect the kernel version from the extracted rootfs modules
        FULL_KVER=$(ls squashfs-root/lib/modules/ | head -n 1)
        
        if [ -z "$FULL_KVER" ]; then
           echo "CRITICAL ERROR: No modules found in squashfs-root/lib/modules/"
           exit 1
        fi
        
        echo "Detected Kernel Version: $FULL_KVER"
        echo "full_version=$FULL_KVER" >> $GITHUB_ENV
        
        # Prepare modules for Dracut (It needs them in /lib/modules on the host)
        mkdir -p /lib/modules
        cp -r squashfs-root/lib/modules/$FULL_KVER /lib/modules/
        
        # Update module dependencies
        depmod -a -b squashfs-root "$FULL_KVER"
        
        echo "Generating Initramfs..."
        dracut --kver "$FULL_KVER" --force -N --xz \
        --kernel-image iso_build/boot/kernel \
        --kmoddir /lib/modules/$FULL_KVER \
        --omit "systemd systemd-initrd systemd-networkd systemd-udevd lvm mdraid multipath" \
        --add "base bash dmsquash-live pollcdrom busybox" \
        --add-drivers "squashfs loop overlay isofs cdrom sr_mod" \
        iso_build/boot/initramfs.img

    # --- PART 4: REPACK ISO ---
    - name: Finalize ISO
      run: |
        # Download Wallpaper
        wget -q -O iso_build/boot/grub/splash.jpg "https://c4.wallpaperflare.com/wallpaper/897/820/61/gentoo-linux-mint-unix-linux-hd-wallpaper-preview.jpg"
        
        # GRUB Config
        cat <<EOF > iso_build/boot/grub/grub.cfg
        insmod all_video
        insmod gfxterm
        insmod jpeg
        insmod png
        background_image /boot/grub/splash.jpg
        set gfxmode=auto
        loadfont unicode
        terminal_output gfxterm
        set timeout=10
        set default=0

        menuentry "Gentoo Linux Next" {
            linux /boot/kernel root=live:CDLABEL=GENTOO_NEXT rd.live.image rd.live.overlay console=tty0
            initrd /boot/initramfs.img
        }
        
        menuentry "Gentoo Linux Next (Ramdisk Mode)" {
            linux /boot/kernel root=live:CDLABEL=GENTOO_NEXT rd.live.image rd.live.ram=1 console=tty0
            initrd /boot/initramfs.img
        }
        EOF

        # Create compressed RootFS image
        mksquashfs squashfs-root iso_build/LiveOS/rootfs.img -comp gzip -noappend
        
        # Build ISO
        grub-mkrescue -o gentoo-next.iso iso_build \
          --volid "GENTOO_NEXT" \
          --product-name "Gentoo Linux Next" \
          --product-version "${{ env.full_version }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gentoo-next-iso
        path: gentoo-next.iso
    
    - name: Create Release
      if: ${{ inputs.create_release == true }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Gentoo Linux Next"
        body: |
          ### Gentoo Linux Next
          - **Base**: Gentoo Minimal ISO (2026-01-14)
          - **Kernel**: ${{ env.full_version }}
        files: gentoo-next.iso
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
