name: Build Gentoo Linux Next
on:
  workflow_dispatch:
    inputs:
      create_release:
        type: boolean
        description: 'Upload to Releases?'
        default: false

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      options: --privileged

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        echo "http://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
        apk update
        # Removed 'dracut', 'device-mapper', 'kmod' (Not needed anymore)
        apk add --no-cache bash wget curl squashfs-tools xorriso grub grub-efi mtools dosfstools jq sed

    - name: Prepare Workspace
      run: |
        mkdir -p iso_build/boot/grub
        # Gentoo LiveCDs expect image.squashfs at the root, not in LiveOS/
        # We will follow the standard Gentoo structure.

    # --- PART 1: EXTRACT ARTIFACTS ---
    - name: Download & Extract ISO
      run: |
        echo "Downloading Gentoo Minimal ISO..."
        # 2026-01-14 Snapshot
        wget -q --show-progress -O minimal.iso "https://distfiles.gentoo.org/releases/amd64/autobuilds/20260114T140056Z/install-amd64-minimal-20260114T140056Z.iso"
        
        mkdir -p mnt_iso
        echo "Extracting ISO contents..."
        xorriso -osirrox on -indev minimal.iso -extract / mnt_iso
        
        # 1. Locate & Copy Kernel
        KERNEL_PATH=$(find mnt_iso -name "gentoo" -type f | head -n 1)
        cp "$KERNEL_PATH" iso_build/boot/kernel
        echo "Reusing Kernel: $KERNEL_PATH"
        
        # 2. Locate & Copy Initramfs (Reuse existing!)
        # Usually named gentoo.igz or gentoo.xz
        INITRD_PATH=$(find mnt_iso -name "gentoo.*gz" -type f -o -name "gentoo.xz" -type f | head -n 1)
        cp "$INITRD_PATH" iso_build/boot/initramfs
        echo "Reusing Initramfs: $INITRD_PATH"
        
        # 3. Locate RootFS
        SQUASH_PATH=$(find mnt_iso -name "image.squashfs" | head -n 1)
        
        echo "Unpacking Root Filesystem..."
        unsquashfs -d squashfs-root "$SQUASH_PATH"
        
        # Cleanup
        rm -rf mnt_iso minimal.iso

    # --- PART 2: MODIFY ROOTFS ---
    - name: Customize System
      run: |
        # 1. Apply Overlay
        if [ -d "overlay" ]; then
          echo "Applying 'overlay/'..."
          cp -ruv overlay/* squashfs-root/
        fi
        
        # 2. Branding
        if [ -f squashfs-root/etc/os-release ]; then
           sed -i 's/^NAME=.*/NAME="Gentoo Linux Next"/' squashfs-root/etc/os-release
           sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="Gentoo Linux Next"/' squashfs-root/etc/os-release
        fi
        echo "Gentoo Linux Next" > squashfs-root/etc/issue
        
        # 3. Unlock Root
        sed -i 's/^root:[^:]*:/root::/' squashfs-root/etc/shadow

    # --- PART 3: REPACK ISO ---
    - name: Build Final ISO
      run: |
        # 1. Repack RootFS
        # We put it at iso_build/image.squashfs because that's where the standard initramfs looks for it
        echo "Compressing RootFS..."
        mksquashfs squashfs-root iso_build/image.squashfs -comp gzip -noappend
        
        # 2. GRUB Branding
        wget -q -O iso_build/boot/grub/splash.jpg "https://c4.wallpaperflare.com/wallpaper/897/820/61/gentoo-linux-mint-unix-linux-hd-wallpaper-preview.jpg"
        
        # 3. GRUB Config
        # We use standard Gentoo LinuxRC arguments here because we are reusing the Gentoo Initramfs
        cat <<EOF > iso_build/boot/grub/grub.cfg
        insmod all_video
        insmod gfxterm
        insmod jpeg
        insmod png
        background_image /boot/grub/splash.jpg
        set gfxmode=auto
        loadfont unicode
        terminal_output gfxterm
        set timeout=10
        set default=0

        menuentry "Gentoo Linux Next" {
            # Standard Gentoo LiveCD Arguments
            linux /boot/kernel root=/dev/ram0 init=/linuxrc looptype=squashfs loop=/image.squashfs cdroot console=tty0
            initrd /boot/initramfs
        }
        
        menuentry "Gentoo Linux Next (Cache to RAM)" {
            linux /boot/kernel root=/dev/ram0 init=/linuxrc looptype=squashfs loop=/image.squashfs cdroot docache console=tty0
            initrd /boot/initramfs
        }
        EOF

        # 4. Generate ISO
        # Note: We don't need to specify version in env, we just build it.
        grub-mkrescue -o gentoo-next.iso iso_build \
          --volid "GENTOO_NEXT" \
          --product-name "Gentoo Linux Next"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gentoo-next-iso
        path: gentoo-next.iso
    
    - name: Create Release
      if: ${{ inputs.create_release == true }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Gentoo Linux Next"
        body: |
          ### Gentoo Linux Next
          - **Base**: Gentoo Minimal ISO (2026-01-14)
          - **Kernel**: Stock Gentoo Kernel (Reused)
          - **Initramfs**: Stock Gentoo Initramfs (Reused)
        files: gentoo-next.iso
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
