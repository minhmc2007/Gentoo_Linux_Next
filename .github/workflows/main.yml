name: Build Gentoo Linux Next
on:
  workflow_dispatch:
    inputs:
      create_release:
        type: boolean
        description: 'Upload to Releases?'
        default: false

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      options: --privileged

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Builder Dependencies
      run: |
        echo "http://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
        echo "http://dl-cdn.alpinelinux.org/alpine/edge/main" >> /etc/apk/repositories
        apk update
        
        apk add --no-cache \
          bash wget curl xz cpio \
          gawk squashfs-tools xorriso \
          grub grub-bios grub-efi \
          mtools dosfstools dracut kmod jq sed \
          tar zstd

    - name: Prepare Workspace
      run: |
        mkdir -p build_area
        mkdir -p modules_stage
        mkdir -p iso_build/boot/grub
        mkdir -p iso_build/LiveOS

    # --- PART 1: ROOT FILESYSTEM ---
    - name: Download & Unpack Stage 3
      run: |
        echo "Downloading Gentoo Stage 3 OpenRC..."
        # 2026-01-14 Snapshot
        wget -q --show-progress -O stage3.tar.xz "https://distfiles.gentoo.org/releases/amd64/autobuilds/20260114T140056Z/stage3-amd64-openrc-20260114T140056Z.tar.xz"
        
        echo "Creating Root Filesystem..."
        mkdir -p squashfs-root
        tar xpf stage3.tar.xz -C squashfs-root --numeric-owner
        
        # Cleanup
        rm -rf squashfs-root/usr/share/doc
        rm -rf squashfs-root/usr/share/man
        rm -rf squashfs-root/var/db/repos/gentoo

    # --- PART 2: CONFIGURATION ---
    - name: Apply Overlay & Config
      run: |
        if [ -d "overlay" ]; then
          echo "Applying 'overlay/'..."
          cp -ruv overlay/* squashfs-root/
        fi
        
        # Branding
        if [ -f squashfs-root/etc/os-release ]; then
           sed -i 's/^NAME=.*/NAME="Gentoo Linux Next"/' squashfs-root/etc/os-release
           sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="Gentoo Linux Next"/' squashfs-root/etc/os-release
        fi
        echo "Gentoo Linux Next" > squashfs-root/etc/issue
        
        # Enable Root Login (Empty Password)
        sed -i 's/^root:[^:]*:/root::/' squashfs-root/etc/shadow
        
        # Essential Service Symlinks
        ln -sf /etc/init.d/udev squashfs-root/etc/runlevels/sysinit/udev || true
        ln -sf /etc/init.d/udev-trigger squashfs-root/etc/runlevels/sysinit/udev-trigger || true

    # --- PART 3: EXTRACT KERNEL FROM ISO ---
    - name: Extract Kernel & Modules (From Minimal ISO)
      id: kernel
      run: |
        echo "Downloading Gentoo Minimal ISO (Donor)..."
        wget -q --show-progress -O minimal.iso "https://distfiles.gentoo.org/releases/amd64/autobuilds/20260114T140056Z/install-amd64-minimal-20260114T140056Z.iso"
        
        mkdir -p mnt_iso mnt_squash
        
        echo "Mounting ISO..."
        mount -o loop minimal.iso mnt_iso
        
        # 1. Grab Kernel
        # Gentoo ISOs usually have kernel at /boot/gentoo or /gentoo
        if [ -f mnt_iso/boot/gentoo ]; then
          cp mnt_iso/boot/gentoo iso_build/boot/kernel
        elif [ -f mnt_iso/gentoo ]; then
          cp mnt_iso/gentoo iso_build/boot/kernel
        else
          # Fallback search
          find mnt_iso -name "gentoo" -type f -exec cp {} iso_build/boot/kernel \; -quit
        fi
        
        if [ ! -f iso_build/boot/kernel ]; then
          echo "CRITICAL ERROR: Could not find kernel image in ISO!"
          ls -R mnt_iso
          exit 1
        fi
        
        # 2. Grab Modules
        # Modules are inside the image.squashfs within the ISO
        if [ -f mnt_iso/image.squashfs ]; then
           echo "Mounting embedded image.squashfs..."
           mount -o loop mnt_iso/image.squashfs mnt_squash
           
           echo "Copying modules..."
           mkdir -p squashfs-root/lib/modules
           cp -av mnt_squash/lib/modules/* squashfs-root/lib/modules/
           
           umount mnt_squash
        else
           echo "CRITICAL ERROR: Could not find image.squashfs in ISO!"
           exit 1
        fi
        
        umount mnt_iso
        
        # 3. Detect Version
        FULL_KVER=$(ls squashfs-root/lib/modules/ | head -n 1)
        
        if [ -z "$FULL_KVER" ]; then
           echo "CRITICAL ERROR: No modules found in extracted path!"
           exit 1
        fi
        
        echo "Extracted Kernel Version: $FULL_KVER"
        echo "full_version=$FULL_KVER" >> $GITHUB_ENV

    # --- PART 4: INITRAMFS ---
    - name: Generate Initramfs
      run: |
        echo "Modules available in: squashfs-root/lib/modules/${{ env.full_version }}"
        
        # Create a local module path for Dracut
        mkdir -p /lib/modules
        cp -r squashfs-root/lib/modules/${{ env.full_version }} /lib/modules/
        
        depmod -a -b squashfs-root "${{ env.full_version }}"
        
        echo "Generating initramfs..."
        dracut --kver "${{ env.full_version }}" --force -N --xz \
        --kernel-image iso_build/boot/kernel \
        --kmoddir /lib/modules/${{ env.full_version }} \
        --omit "systemd systemd-initrd systemd-networkd systemd-udevd lvm mdraid multipath" \
        --add "base bash dmsquash-live pollcdrom busybox" \
        --add-drivers "squashfs loop overlay isofs cdrom sr_mod" \
        iso_build/boot/initramfs.img

    # --- PART 5: ISO PACKAGING ---
    - name: Configure GRUB
      run: |
        wget -q -O iso_build/boot/grub/splash.jpg "https://c4.wallpaperflare.com/wallpaper/897/820/61/gentoo-linux-mint-unix-linux-hd-wallpaper-preview.jpg"
        
        cat <<EOF > iso_build/boot/grub/grub.cfg
        insmod all_video
        insmod gfxterm
        insmod jpeg
        insmod png
        background_image /boot/grub/splash.jpg
        set gfxmode=auto
        loadfont unicode
        terminal_output gfxterm
        set timeout=10
        set default=0

        menuentry "Gentoo Linux Next" {
            linux /boot/kernel root=live:CDLABEL=GENTOO_NEXT rd.live.image rd.live.overlay console=tty0
            initrd /boot/initramfs.img
        }
        
        menuentry "Gentoo Linux Next (Ramdisk Mode)" {
            linux /boot/kernel root=live:CDLABEL=GENTOO_NEXT rd.live.image rd.live.ram=1 console=tty0
            initrd /boot/initramfs.img
        }
        EOF

    - name: Build ISO Image
      run: |
        mksquashfs squashfs-root iso_build/LiveOS/rootfs.img -comp gzip -noappend
        
        grub-mkrescue -o gentoo-next.iso iso_build \
          --volid "GENTOO_NEXT" \
          --product-name "Gentoo Linux Next" \
          --product-version "${{ env.full_version }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gentoo-next-iso
        path: gentoo-next.iso

    - name: Create Release
      if: ${{ inputs.create_release == true }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Gentoo Linux Next"
        body: |
          ### Gentoo Linux Next
          - **Base**: Stage 3 OpenRC (2026-01-14)
          - **Kernel**: ${{ env.full_version }} (Extracted from Minimal ISO)
        files: gentoo-next.iso
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
